<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="wilzxxiii">

  <title>wilzxxiii</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Import Rock Salt Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #301934;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #301934;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
      padding: 0 5vw;
      box-sizing: border-box;
      text-align: center;
    }

 


    .main-text {
      font-family: 'Lavishly Yours', cursive;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      color: #FFFFFF;
      /* text-shadow: 
        5px 5px 0 #00FFFF,
        -4px -4px 0 #FFFF00; */
      letter-spacing: clamp(2px, 1vw, 6px);
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .sub-text {
      font-family: 'Lavishly Yours', cursive;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      color: #FFFFFF;
      opacity: 0.85;
      margin-top: 10px;
    }

    .status {
      margin-top: clamp(30px, 8vh, 60px);
      font-family: 'Lacquer', system-ui;
      font-size: clamp(2rem, 9vw, 4.6rem);
      color: #FFFFFF;
      animation: pulse 1.8s infinite;
      line-height: 1.2;
      word-break: break-word;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="main-text animate__animated animate__rotateInDownLeft">Wait a minute</div>
    <div class="sub-text animate__animated animate__rotateInDownRight">Painting my ...</div>
    <div class="status animate__animated animate__bounce ">Masterpiece [?]</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Auto hide when app loads -->
  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      
      setTimeout(() => {
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 800);
        }
      }, 1600);
    });
  </script>
</body>
</html>
