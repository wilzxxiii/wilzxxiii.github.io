<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="wilzxxiii">

  <title>wilzxxiii</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Import Rock Salt Font -->
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A0A0A;
      overflow: hidden;
    }

    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #0A0A0A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    .main-text {
      font-family: 'Rock Salt', cursive;
      font-size: 72px;
      color: #FF00FF;
      text-shadow: 
        5px 5px 0 #00FFFF,
        -4px -4px 0 #FFFF00;
      letter-spacing: 6px;
      margin-bottom: 20px;
    }

    .sub-text {
      font-family: 'Rock Salt', cursive;
      font-size: 34px;
      color: #FFFFFF;
      opacity: 0.85;
      margin-top: 10px;
    }

    .status {
      margin-top: 60px;
      font-family: 'Rock Salt', cursive;
      font-size: 22px;
      color: #00FFAA;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="main-text">Wait homie</div>
    <div class="sub-text">loading this sh*t...</div>
    
    <div class="status">Chill 🥶</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <!-- Auto hide when app loads -->
  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('loading');
      
      setTimeout(() => {
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(() => {
            loading.style.display = 'none';
          }, 800);
        }
      }, 1600);
    });
  </script>
</body>
</html>
